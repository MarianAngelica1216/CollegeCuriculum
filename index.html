<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Calculator & Degree Planner</title>
  <meta name="description"
    content="Interactive 4-Year Degree Curriculum Calculator with drag-and-drop course organizing, credit unit calculations, and prerequisite tracking.">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <!-- Navbar Header -->
    <header class="app-header">
      <div class="header-content">
        <!-- Brand Title -->
        <div class="brand-section">
          <div class="brand-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
              </path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Mapúa University</h1>
            <div class="brand-subtitle">BS Computer Science Curriculum (2025)</div>
          </div>
        </div>

        <!-- Global Summary Statistics -->
        <div class="header-stats">
          <div class="stat-chip">
            <div>
              <div class="stat-value" id="totalUnits">0.0</div>
              <div class="stat-label">Total Units</div>
            </div>
          </div>
          <div class="stat-chip">
            <div>
              <div class="stat-value" id="finishedUnits" style="color: var(--accent-emerald);">0.0</div>
              <div class="stat-label">Finished</div>
            </div>
          </div>
          <div class="stat-chip">
            <div>
              <div class="stat-value" id="unitsLeft" style="color: var(--accent-amber);">0.0</div>
              <div class="stat-label">Units Left</div>
            </div>
          </div>
          <div class="stat-chip">
            <div>
              <div class="stat-value" id="prereqConflicts">0</div>
              <div class="stat-label">Alerts</div>
            </div>
          </div>
        </div>

        <!-- Top Action Buttons (Hamburger Menu) -->
        <div class="header-actions">
          <div class="header-menu-wrapper">
            <button class="hamburger-btn" id="headerMenuToggleBtn" title="Menu Options">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div class="header-dropdown-menu hidden" id="headerDropdownMenu">
              <button class="menu-item-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                <!-- Filled dynamically by JS -->
              </button>
              <button class="menu-item-btn" id="printBtn" title="Print or Save as PDF">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                  </path>
                </svg>
                <span>Print PDF</span>
              </button>
              <button class="menu-item-btn" id="resetBtn" title="Reset to default template">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                  </path>
                </svg>
                <span>Reset Curriculum</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="main-layout" id="mainLayout">
      <!-- Curriculum Grid Section (Left) -->
      <section class="curriculum-area">
        <!-- Controls Bar (Tabs & View Modes) -->
        <div class="curriculum-controls">
          <div class="year-tabs" id="yearTabs">
            <button class="tab-btn active" data-year="1">Year 1</button>
            <button class="tab-btn" data-year="2">Year 2</button>
            <button class="tab-btn" data-year="3">Year 3</button>
            <button class="tab-btn" data-year="4">Year 4</button>
          </div>

          <div class="view-toggle-group">
            <button class="toggle-btn" id="viewGridAllBtn" title="Full 16-Term Matrix">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2zM4 21a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2z">
                </path>
              </svg>
              Full Matrix
            </button>
            <button class="toggle-btn" id="compareToggleBtn" title="Toggle Side-by-Side School Comparison">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"></path>
              </svg>
              Compare
            </button>
          </div>
        </div>

        <!-- Term Tables Grid Container -->
        <div id="curriculumContainer"></div>
      </section>

      <!-- Course Bank Sidebar (Right) -->
      <aside class="course-bank-sidebar" id="courseBankSidebar">
        <div class="bank-panel">
          <div class="bank-header">
            <div class="bank-title">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                </path>
              </svg>
              Course Repository
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="bank-count" id="bankCount">0</span>
              <button class="bank-collapse-toggle-btn" id="bankCollapseToggleBtn" title="Collapse Repository to Bubble">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Quick Search Row with + Add Course Bubble Button -->
          <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
            <div class="search-box" style="flex: 1; margin-bottom: 0;">
              <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
              <input type="text" id="searchInput" class="search-input" placeholder="Search code, name, pre-reqs...">
            </div>
            <button class="add-course-bubble-btn" id="openAddCourseModalBtn" title="Add New Course">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
              </svg>
              <span>Add Course</span>
            </button>
          </div>

          <!-- Repository Filter Row (Tabs & Extra Filter Popover) -->
          <div class="repository-filter-wrapper">
            <div class="bank-filter-group" id="bankFilterGroup">
              <button class="bank-filter-btn active" data-filter="unassigned">Unassigned</button>
              <button class="bank-filter-btn" data-filter="assigned">Assigned</button>
              <button class="bank-filter-btn" data-filter="all">All</button>
            </div>

            <button class="filter-dropdown-toggle-btn" id="repoFilterToggleBtn" title="Filter options (Color & Status)">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                </path>
              </svg>
            </button>

            <!-- Popover Filter Menu -->
            <div class="repo-filter-menu hidden" id="repoFilterMenu">
              <div class="filter-menu-header">
                <span>Filter Courses</span>
                <button class="filter-menu-close" id="closeRepoFilterMenuBtn">&times;</button>
              </div>

              <div class="filter-menu-section">
                <label class="filter-menu-label">Status Filter</label>
                <select id="repoStatusFilterSelect" class="filter-menu-select">
                  <option value="all">All Statuses</option>
                  <option value="finished">✓ Finished / Accomplished</option>
                  <option value="unfinished">⏳ Unfinished / Upcoming</option>
                </select>
              </div>

              <div class="filter-menu-section" style="margin-top: 10px;">
                <label class="filter-menu-label">Color Filter (Used Colors)</label>
                <div class="repo-color-swatches" id="repoColorSwatches"></div>
              </div>

              <div style="margin-top: 12px; display: flex; justify-content: flex-end;">
                <button class="btn btn-secondary" id="resetRepoFiltersBtn"
                  style="padding: 3px 10px; font-size: 0.72rem;">Clear Filters</button>
              </div>
            </div>
          </div>

          <!-- Cards Repository Container -->
          <div class="bank-cards-container" id="bankCardsContainer"></div>
        </div>
      </aside>

      <!-- Little Square Button to Expand Course Repository Window -->
      <button class="bank-square-btn hidden" id="bankSquareBtn" title="Expand Course Repository">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
          </path>
        </svg>
        <span class="square-count-badge" id="squareBankCount">0</span>
      </button>
    </main>
  </div>

  <!-- Edit Course Modal -->
  <div class="modal-overlay" id="editModal"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JavaScript Scripts -->
  <script src="sample-data.js"></script>
  <script src="app.js"></script>
</body>

</html>
